name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      # claude/clean-project-clone-s216ne was removed here on 2026-08-15: it
      # was a branch on the repository history that predates the re-clone, it
      # shares no common ancestor with main, and it is being deleted. A
      # trigger naming a branch that does not exist is dead config of exactly
      # the kind this repo keeps finding — it never fires and nothing says so.
      - main
    paths:
      - 'scripts/build_github_pages_redirect.sh'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build redirect stubs
        # GitHub Pages no longer serves a live copy of the site — it's now
        # just a redirect to the canonical Cloudflare deployment, so old
        # links and bookmarks still land somewhere real instead of a stale
        # or missing copy. See scripts/build_github_pages_redirect.sh and
        # docs/DEMO_HOSTING.md's "GitHub Pages now redirects" section.
        run: bash scripts/build_github_pages_redirect.sh
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
