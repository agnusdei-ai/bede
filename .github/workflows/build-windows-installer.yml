name: Build Windows installer (.exe)

# Compiles packaging/windows/BedeSetup.iss (Inno Setup) on a real Windows
# runner — ISCC.exe is Windows-native and isn't preinstalled on
# ubuntu-latest. Signs the result with Azure Artifact Signing (Basic tier)
# IF the repo has the required secrets/vars configured — see
# docs/WINDOWS_INSTALLER.md's "Code signing" section for the one-time Azure
# Portal + GitHub setup this depends on. Without them, this still builds and
# uploads an UNSIGNED .exe (SmartScreen will warn on it) — signing is
# additive, not a hard requirement to keep this workflow green.
#
# Signing only runs on pushes to main (never on pull_request or a
# workflow_dispatch off a feature branch) — the federated credential this
# depends on is deliberately scoped to just the main branch, so a PR's code
# (however trusted the author) can never authenticate to sign anything.
on:
  push:
    branches: [main]
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/build-windows-installer.yml'
  pull_request:
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/build-windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for azure/login's OIDC federated-credential exchange; unused (and harmless) when signing is skipped

jobs:
  build:
    runs-on: windows-latest
    env:
      # Read once per job so later `if:` conditions can check env.* — a
      # secret can't be referenced directly in a step's `if:`, but a
      # job-level env var populated from one can.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      INSTALLER_PATH: packaging\windows\Output\BedeSetup.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compile BedeSetup.iss (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275 # v1.2.2
        with:
          path: packaging/windows/BedeSetup.iss

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: env.AZURE_CLIENT_ID != '' && github.ref == 'refs/heads/main'
        with:
          dotnet-version: '8.0.x'

      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != '' && github.ref == 'refs/heads/main'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign BedeSetup.exe (Azure Artifact Signing)
        if: env.AZURE_CLIENT_ID != '' && github.ref == 'refs/heads/main'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_CERT_PROFILE }}
          files: ${{ env.INSTALLER_PATH }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ (env.AZURE_CLIENT_ID != '' && github.ref == 'refs/heads/main') && 'BedeSetup-signed' || 'BedeSetup-unsigned' }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
