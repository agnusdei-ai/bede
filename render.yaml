# Render Blueprint for Bede's PUBLIC DEMO backend ONLY.
#
# Do NOT use this for a family's real production instance — that should stay
# self-hosted on a LAN per CLAUDE.md's security model (voice biometrics,
# AES-256-GCM encrypted student data, tablet-only network exposure). This
# exists purely to give the demo's self-service "Get your own code" path (see
# demo/README.md) a real backend to talk to, without self-hosting a full
# Docker Compose stack just for a public, stateless demo.
#
# One-time setup — see docs/DEMO_HOSTING.md for the full walkthrough:
#   1. render.com -> New -> Blueprint -> connect this repo -> it reads this file.
#   2. Fill in every env var marked `sync: false` below from Render's
#      dashboard after the first deploy (Render deliberately won't let a
#      committed file set actual secrets).
#   3. Copy the resulting service URL (https://bede-demo-api-XXXX.onrender.com)
#      into this repo's Settings -> Secrets and variables -> Actions ->
#      Variables -> VITE_DEMO_API_BASE, then re-run the "Deploy demo to
#      GitHub Pages" workflow so the static demo picks it up.
#
# NOTE: written against Render's documented Blueprint spec
# (render.com/docs/blueprint-spec) but not validated against a live Render
# deploy from this sandbox (no network access to render.com here). If Render
# rejects a field name, check that page for the current schema — Blueprint
# parsing fails fast with a clear error rather than silently misconfiguring.

databases:
  - name: bede-demo-db
    # Paid tier, not free — deliberately upgraded at some point after this
    # Blueprint's first deploy (most likely to avoid the free Postgres
    # tier's periodic expiry/recreation, unlike a free web service, which
    # just cold-starts rather than actually disappearing). This value MUST
    # match the database's actual current plan in Render's dashboard:
    # Blueprint sync refuses to auto-downgrade a database as a safety
    # guard, so a mismatch here (e.g. this file still saying `free` after
    # a dashboard upgrade) fails every single sync with
    # "databases[0].plan cannot downgrade database from X to Y" until
    # corrected — exactly what happened before this comment was added,
    # and then AGAIN on 2026-08-04, when the dashboard read Pro-4gb while
    # this line still said basic-256mb. The comment above was already
    # right; what it lacked was anything that FAILS when the two drift, so
    # it drifted again. Treat a plan change in the dashboard as a change
    # that must be mirrored here in the same sitting.
    plan: pro-4gb
    databaseName: bede_demo
    user: bede

services:
  - type: web
    name: bede-demo-api
    runtime: docker
    # Upgraded Free → Pro in the dashboard on 2026-08-04. Mirrored here the
    # same day, and the mirroring is not cosmetic: unlike the database plan
    # above (where Render REFUSES a downgrade and fails the sync loudly), a
    # web service plan is applied as written. Leaving `free` here while the
    # dashboard says Pro means the next successful Blueprint sync silently
    # downgrades the running service back to Free — undoing the upgrade with
    # no error anywhere. The two mismatches were also coupled: syncs were
    # already failing on the database plan, so this one sat harmless and
    # invisible until that was fixed, at which point it would have fired.
    # Fixing either alone was the trap; they had to move together.
    plan: pro
    rootDir: homeschool-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render's Postgres gives a plain postgresql:// string — core/database.py
      # normalizes that to the +asyncpg driver scheme automatically, so this
      # can be wired straight through with no manual editing.
      - key: DATABASE_URL
        fromDatabase:
          name: bede-demo-db
          property: connectionString

      # Secrets — set these in Render's dashboard after the first deploy.
      # ANTHROPIC_API_KEY is OPTIONAL — this deployment does not require it
      # to boot (BEDE_ADAPTER_ORDER below already has OpenAI as primary and
      # Mistral as the default failover), but it's listed in the order
      # below as a SECOND, selectable failover option: fill this in and
      # Claude becomes available as a failover choice via
      # core/provider_state.py's live secondary-adapter override (see
      # routers/admin.py's POST /admin/ai-provider/secondary and
      # docs/PROVIDER_ADAPTERS.md) without any further deploy. Leave it
      # blank and nothing changes — an unconfigured adapter is simply
      # invisible to that override, exactly as before.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Doubles as both OpenAI TTS (services/voice_synthesis.py) and the
      # OpenAI chat adapter (services/adapters/openai_compatible_adapter.py)
      # now that BEDE_ADAPTER_ORDER includes "openai" below — same key, two
      # uses, one Render dashboard entry.
      - key: OPENAI_API_KEY
        sync: false
      # Mistral chat adapter secondary — see docs/PROVIDER_ADAPTERS.md. Get a
      # key at console.mistral.ai (La Plateforme) -> API Keys.
      - key: MISTRAL_API_KEY
        sync: false
      # Cloud-first boot order for this Render demo/dev deployment: OpenAI
      # primary, Mistral the DEFAULT failover, Anthropic a third, optional
      # candidate — present in the order so it's a legitimate choice for
      # core/provider_state.py's live secondary override the moment
      # ANTHROPIC_API_KEY above is filled in, without changing this file or
      # redeploying. Deliberately excludes "local" (Render has no GPU to run
      # vLLM/Qwen3-Coder) and does not require "anthropic" to be configured
      # at all — this demo boots and serves fully on OpenAI+Mistral with
      # that key left blank, unchanged from before. Because
      # services/ai_service.py's `_client` resolves via
      # router.resolve_with_failover() (not the plain get_default_client()),
      # this is LIVE failover, not just a boot-time preference: if OpenAI
      # errors (auth/rate-limit/connection failure) on a request, that
      # request automatically retries against whichever adapter is second
      # in the effective order (Mistral by default, or Claude if an
      # operator has picked it via the secondary override) before any
      # content streams back, with a ~60s circuit-breaker cooldown on the
      # failed provider.
      # A family's self-hosted production instance should instead follow the
      # docs/PROVIDER_ADAPTERS.md default (local,anthropic) or its own choice.
      - key: BEDE_ADAPTER_ORDER
        value: openai,mistral,anthropic
      # Neither of these was ever declared here before — without them,
      # services/email_service.py's email_configured() is False, which
      # silently no-ops the post-session summary email, the distress alert,
      # AND the new beta feedback form below, regardless of FEEDBACK_EMAIL.
      # RESEND_FROM_ADDRESS must be a sender verified against a domain
      # you've added in Resend's dashboard, not just any address.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      # This demo instance's parent/child roles are never advertised or used
      # at all — CHILD_PIN still must satisfy pin_is_strong() (see
      # core/config.py), so pick a real compliant PIN rather than a placeholder.
      - key: CHILD_PIN
        sync: false
      # No longer a credential anyone types — purely the on/off switch for
      # the whole public demo (empty = demo disabled). Still must satisfy
      # pin_is_strong() (6+ digits, no sequential run/repeated block/
      # palindrome) since core/config.py validates it the same way regardless.
      - key: DEMO_PIN
        sync: false

      # Auto-generated — random by design, nobody needs to remember these.
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_SECRET
        generateValue: true
      # Independent signing key for this instance's DEMO identity domain
      # (homeschool-api/core/identity.py). Tokens are always domain-separated
      # — a demo token can never be replayed as a parent token — but without
      # this both domain keys derive from SECRET_KEY above, which is
      # separation without isolation.
      #
      # This deployment is exactly the case that wants isolation: it is
      # internet-facing, multi-tenant, and operated for strangers rather than
      # by them, so a SECRET_KEY compromise here should not reach any family
      # deployment. Generated rather than `sync: false` — nobody needs to
      # know its value, and a key nobody has to handle is a key nobody
      # leaks. GET /admin/status reports whether it is independent or
      # derived, so this can be confirmed after deploy rather than assumed.
      - key: DEMO_SECRET_KEY
        generateValue: true
      - key: PARENT_PASSWORD
        generateValue: true

      # Where beta CX/UX/content-quality feedback (POST /feedback, see
      # routers/feedback.py) is routed. Not a secret — just an inbox address —
      # but the feature stays inert either way until RESEND_API_KEY and
      # RESEND_FROM_ADDRESS are also set (dashboard, sync: false — neither is
      # configured on this Blueprint yet, see the note above about setting
      # secrets manually after the first deploy).
      - key: FEEDBACK_EMAIL
        value: info@agnusdei.ai

      # Fixed, non-secret settings.
      - key: DEMO_STUDENT_NAME
        value: Guest
      - key: DEMO_GRADE
        value: "4"
      - key: DEMO_GRADE_STAGE
        value: "3-5"
      # Offers the English/Español toggle on the demo's CodeScreen (see
      # docs/LOCALIZATION.md's per-login model) so Spanish-speaking beta
      # testers can actually exercise the localized experience end to end.
      # Fixed here rather than sync: false since it's not a secret, just a
      # product decision — see docs/DEMO_HOSTING.md's "Spanish beta testing"
      # section for verification steps and how to turn it back off.
      - key: LOCALE
        value: es
      # Speech-to-text runs at OpenAI on THIS deployment, not in this
      # process. Not a quality or speed decision — a memory one, and the
      # direct fix for a real, repeated failure: faster-whisper's
      # ctranslate2 backend imports torch (~480MB of RSS on import alone)
      # whenever torch is present, which put this service at 642MB warmed
      # against the free plan's 512MB cap. Render OOM-killed it, and because
      # services/streaming_transcription.py keeps its sessions in memory in
      # a single process, every restart destroyed every child's in-flight
      # voice turn — surfacing in the browser as `startVoiceStream failed:
      # Load failed` and a mic that appeared broken. On this setting nothing
      # imports faster_whisper at all, so torch never loads.
      #
      # Deliberately NOT the default in core/config.py, and never right for
      # a family's self-hosted instance: local transcription is exactly what
      # keeps a child's voice on their own LAN. This demo already sends the
      # whole conversation to OpenAI's chat models and already uses OpenAI
      # for TTS, so it was paying that 480MB for a privacy property it does
      # not claim. Disclosed in demo/public/privacy.html (both languages),
      # docs/RETENTION_POLICY.md and docs/VENDOR_DATA_FLOW.md — keep those
      # in step with this value.
      - key: TRANSCRIPTION_PROVIDER
        value: openai
      # A browser's CORS Origin header is always scheme://host[:port] with
      # NO path — even though the demo itself is served from
      # https://agnusdei-ai.github.io/bede/, the Origin it sends is just
      # https://agnusdei-ai.github.io. Including the /bede path here would
      # never match, silently CORS-blocking every request from the demo.
      #
      # agnusdei.ai and bede.ai are both listed ahead of actually moving the
      # demo to either one (see docs/DEMO_HOSTING.md's "GitHub Pages now
      # redirects" section) — an unused origin here is inert, so
      # listing both candidates now means flipping the live domain later
      # needs no backend redeploy. bede.agnusdei.workers.dev is the
      # Cloudflare Worker's own default preview domain, needed until a
      # candidate domain's nameservers are pointed at Cloudflare.
      #
      # agnusdei.io was live on the same Worker (Custom Domain, nameservers
      # on Cloudflare) as of the 2026-07 beta launch, as the interim beta
      # domain while agnusdei.ai's transfer was mid-flight and its registrar
      # had DNS/nameserver controls locked for the duration. That transfer
      # has since cleared (2026-08-04): agnusdei.ai is now attached to the
      # same Worker too, and is the intended long-term brand domain (each
      # page carries a <link rel="canonical"> pointing at it), but a
      # redirect from .io was deliberately NOT set up — both domains stay
      # genuinely live on purpose, so a domain-specific failure on .ai
      # (its zone, its cert, anything scoped to that one hostname) doesn't
      # take .io down with it, and so .io keeps somewhere real to actually
      # point AT if it's ever repointed to a second, independent Worker
      # for true redundancy against the current single-Worker shared fate
      # (see docs/DEMO_HOSTING.md's "Interim beta domain: agnusdei.io"
      # section for the full reasoning). Both domains' CORS entries here
      # stay live and needed, not a cleanup candidate.
      - key: CORS_ORIGINS
        value: https://agnusdei-ai.github.io,https://agnusdei.ai,https://www.agnusdei.ai,https://agnusdei.io,https://www.agnusdei.io,https://bede.ai,https://www.bede.ai,https://bede.agnusdei.workers.dev
      - key: DISABLE_API_DOCS
        value: "true"
      - key: PRODUCTION
        value: "true"
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      # OPENAI_TTS_INSTRUCTIONS/OPENAI_TTS_SPEED are deliberately NOT pinned
      # here, so this demo inherits core/config.py's own defaults for both —
      # see that file's openai_tts_voice/openai_tts_instructions/
      # openai_tts_speed docstrings for the "fable" + slower-pace tuning
      # history.
      - key: OPENAI_TTS_VOICE
        value: fable
