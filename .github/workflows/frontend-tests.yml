name: Frontend regression tests

# Closes a real gap: test.yml ("Backend regression tests") never covered
# either frontend app — its path filters only match homeschool-api/** and
# the two script dirs, so a demo/** or homeschool-tutor/**-only PR got zero
# CI checks at all (confirmed directly: PR #182 and #185 both showed
# mergeable_state clean with total_count: 0 check-runs, merged on local
# `npx tsc --noEmit` + `npx vitest run` output instead of any automated
# gate). This workflow is that gate, mirroring test.yml's own
# push(main)/pull_request/workflow_dispatch trigger shape and per-job
# path-filtered structure, just for the two Vite/React apps instead of
# the Python backend.
#
# `npm audit --audit-level=moderate` runs as a HARD gate in each job.
#
# History worth keeping, because the gate has been removed once already:
# it was deleted in #296 on the reasoning that a CVE "with no fix
# available yet" blocked every unrelated PR, and that .github/dependabot.yml
# (deleted in #285) was no longer there to auto-fix anything. The first
# half of that turned out to be wrong on the facts — every one of the five
# advisories then outstanding had a fix available, and `npm audit fix`
# plus a react-router major bump cleared all five. The second half was
# right, and is addressed properly now: dependabot.yml is restored, so the
# gate has the auto-fix companion whose absence was the real complaint.
#
# The rule going forward: a red audit gate means "upgrade the dependency
# or record why it is unreachable in .github/audit-allowlist.json", never
# "delete the step." Deleting it took this repo from one blocked PR to
# zero vulnerability visibility across three ecosystems, which is a much
# worse trade than the one it was trying to make.
on:
  push:
    branches: [main]
    paths:
      - 'homeschool-tutor/**'
      - 'demo/**'
      - 'site/assets/site.css'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
  workflow_dispatch:

# No job here writes to the repo, comments on a PR, or creates a release —
# the default token only ever needs to check out code.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything that is not a pull_request (push to main,
          # workflow_dispatch) runs the full set — the skip is a PR-only
          # optimisation, and failing open here costs CI minutes rather than
          # coverage.
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # site/assets/site.css is in here because src/palette.test.ts reads
          # it: the app's ramps are pinned to the marketing site's own colour
          # tokens, so retuning the brand palette there is the change most
          # likely to break that agreement. Without this path the skip would
          # compute relevant=false for exactly that edit and never run the
          # guard written for it — the same vacuous-coverage trap
          # test_decision_register.py documents for the backend filter.
          if git diff --name-only "$BASE_SHA" HEAD \
               | grep -qE '^(homeschool-tutor/|demo/|site/assets/site\.css|\.github/workflows/frontend-tests\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
  homeschool-tutor-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homeschool-tutor/package-lock.json
      - name: Install dependencies
        working-directory: homeschool-tutor
        run: npm ci
      - name: Audit dependencies for known vulnerabilities
        working-directory: homeschool-tutor
        # Hard gate at MODERATE, not high.
        #
        # `--audit-level=high` was the threshold when this gate was first
        # written, and it is not sufficient. The open redirect fixed in
        # #319 — the highest-impact finding in that whole review, a
        # post-authentication redirect off-site on the login screen — was
        # published as a MODERATE advisory (GHSA-wrjc-x8rr-h8h6). A gate
        # set to `high` would have let it through untouched, which is
        # exactly what happened for as long as it sat in the tree.
        #
        # npm's severity rating reflects the advisory in the abstract, not
        # what the dependency is load-bearing for in THIS app. A moderate
        # advisory in the router that owns our post-login navigation
        # matters more here than a high one in a build-time-only tool. We
        # are not positioned to make that judgement automatically, so the
        # gate errs toward surfacing it and letting a human decide.
        #
        # Both projects sit at zero findings, so this costs nothing today.
        # When it goes red: upgrade, or record why it is unreachable —
        # never delete the step, and never quietly raise the threshold
        # back to high to make a red build go away.
        run: npm audit --audit-level=moderate
      - name: Type-check
        working-directory: homeschool-tutor
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: homeschool-tutor
        run: npm test

  demo-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install dependencies
        working-directory: demo
        run: npm ci
      - name: Audit dependencies for known vulnerabilities
        working-directory: demo
        # Hard gate at MODERATE, not high.
        #
        # `--audit-level=high` was the threshold when this gate was first
        # written, and it is not sufficient. The open redirect fixed in
        # #319 — the highest-impact finding in that whole review, a
        # post-authentication redirect off-site on the login screen — was
        # published as a MODERATE advisory (GHSA-wrjc-x8rr-h8h6). A gate
        # set to `high` would have let it through untouched, which is
        # exactly what happened for as long as it sat in the tree.
        #
        # npm's severity rating reflects the advisory in the abstract, not
        # what the dependency is load-bearing for in THIS app. A moderate
        # advisory in the router that owns our post-login navigation
        # matters more here than a high one in a build-time-only tool. We
        # are not positioned to make that judgement automatically, so the
        # gate errs toward surfacing it and letting a human decide.
        #
        # Both projects sit at zero findings, so this costs nothing today.
        # When it goes red: upgrade, or record why it is unreachable —
        # never delete the step, and never quietly raise the threshold
        # back to high to make a red build go away.
        run: npm audit --audit-level=moderate
      - name: Type-check
        working-directory: demo
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: demo
        run: npm test
