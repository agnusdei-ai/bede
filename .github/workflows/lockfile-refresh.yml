name: Lockfile refresh

# Keeps homeschool-api's hash-pinned lockfiles in step with what
# requirements*.in already permit, and opens ONE standing pull request when
# they drift.
#
# WHY THIS EXISTS
#
# test.yml's lockfile-freshness gate regenerates from requirements*.in and
# fails if the committed lockfiles differ. That catches the thing it was
# written for — someone editing an .in file without regenerating — but it also
# fails whenever ANY transitive dependency publishes a release, because the
# comparison is against a live resolve rather than against the previous
# commit. Nothing in the repository has to change for it to go red.
#
# That happened twice on 2026-08-15 alone (openai 3.0.0 -> 3.1.0 in #439,
# charset-normalizer 3.5.0 -> 3.5.1 in #443), and both times it blocked
# unrelated pull requests until someone regenerated by hand. The toil is
# predictable and mechanical, which is what a schedule is for.
#
# ── THIS IS NOT DEPENDABOT'S JOB, AND NOT ITS FAILURE MODE ────────────────
#
# .github/dependabot.yml deliberately runs security-updates-only
# (open-pull-requests-limit: 0) because routine version-update PRs did real
# damage in #285 — react/react-dom bumped as half a pair, a breaking
# tailwindcss major merged with no migration. Nothing here reopens that.
#
# The distinction is that a lockfile refresh is not a proposal to UPGRADE
# anything. The floors in requirements*.in are untouched; pip-compile only
# re-derives a generated artifact from unchanged source, within the range
# those floors already allow. The choice this workflow presents is not
# "upgrade or don't" — it is "let CI stay red or don't", because CI installs
# from the lockfile and the gate compares against a live resolve either way.
#
# Two properties keep it from becoming #285's churn:
#   * ONE standing PR, on a fixed branch, updated in place. A week of daily
#     runs produces one pull request, not seven.
#   * It NEVER MERGES. Same bound demo-watchdog.yml sets for its own agent:
#     it opens a PR and stops. A dependency change reaching main without a
#     human reading it is exactly what #285 was about.
#
# ── A ROOT CAUSE THIS ONLY PALLIATES ─────────────────────────────────────
#
# Automating the toil is not the same as removing it. The deeper question is
# whether lockfile-freshness should compare against a live resolve at all, or
# only fail when requirements*.in changed without the lockfiles changing with
# them. The latter tests the drift the gate was written for and would not fire
# on upstream publishes — but it also gives up the "the lockfile is current"
# property, which is a supply-chain posture decision rather than a cleanup.
# Recorded here rather than decided unilaterally. RULED ON 2026-08-15 — keep
# the live resolve; see docs/DECISIONS.md entry 12, which closes on the
# bargain that THIS workflow removes the toil.
#
# ── A REPOSITORY SETTING THIS FILE CANNOT SET ────────────────────────────
#
# `pull-requests: write` below is necessary and NOT sufficient. A separate
# repository/organisation toggle governs whether Actions may open a PR at
# all, and with it off `gh pr create` fails with:
#
#     GraphQL: GitHub Actions is not permitted to create or approve pull
#     requests (createPullRequest)
#
# Enable it at: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
#
# Until then this job regenerates and pushes correctly and then cannot open
# the pull request, so the toil entry 12 assumes is automated is manual
# again. That is what happened on 2026-08-18, and it was invisible for
# three days because the two prior runs found no drift and skipped every
# step after the regeneration — the first time this job was needed was the
# first time its PR path ran at all.

on:
  schedule:
    # Daily, off the hour and clear of the other crons in this repo
    # (site-headers-live at :17, keep-demo-warm every 10 min from 12:00).
    - cron: '41 5 * * *'
  workflow_dispatch:

# Read-only by default; the one job that needs to write says so itself and
# says why, matching demo-watchdog.yml's convention.
permissions:
  contents: read

concurrency:
  # A manual run during a scheduled one should not race it onto the same
  # branch. Not cancel-in-progress: a half-finished pip-compile that gets
  # killed mid-write is worse than waiting.
  group: lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # pip-compile --generate-hashes over this tree (torch and its CUDA stack
    # included) took ~17 minutes when run by hand. Generous, but bounded.
    timeout-minutes: 45
    permissions:
      contents: write        # to push the refresh branch — NOT to push to main
      pull-requests: write   # to open or update the standing PR
    env:
      BRANCH: chore/lockfile-refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          # Must match lockfile-freshness's own interpreter. pip-compile
          # records it in the generated file's header, so refreshing under a
          # different Python produces a file that fails the very gate this
          # workflow exists to keep green.
          python-version: '3.12'

      - name: Regenerate the lockfiles
        id: regen
        working-directory: homeschool-api
        run: |
          bash scripts/check_lockfile_freshness.sh --fix
          if git diff --quiet -- requirements.lock.txt requirements-dev.lock.txt; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
            echo "Lockfiles already current — nothing to do."
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise what actually moved
        if: steps.regen.outputs.drifted == 'true'
        id: summary
        run: |
          # Name the packages rather than saying "dependencies updated". A
          # refresh that quietly adds or removes a package is the one outcome
          # worth catching by eye, and a count makes that visible.
          {
            echo 'body<<PRBODY'
            echo 'Opened by `.github/workflows/lockfile-refresh.yml`. The floors in'
            echo '`requirements*.in` are unchanged — this only re-derives the'
            echo 'hash-pinned lockfiles from them, under Python 3.12 to match the'
            echo '`lockfile-freshness` gate.'
            echo
            for f in requirements.lock.txt requirements-dev.lock.txt; do
              echo "### \`$f\`"
              echo '```'
              diff <(git show "HEAD:homeschool-api/$f" | grep -oE '^[a-zA-Z0-9_.-]+==[^ ]*') \
                   <(grep -oE '^[a-zA-Z0-9_.-]+==[^ ]*' "homeschool-api/$f") \
                | grep -E '^[<>]' | sort -k2 || echo '(no version changes)'
              echo '```'
              echo "packages before: $(git show "HEAD:homeschool-api/$f" | grep -cE '^[a-zA-Z0-9_.-]+==')" \
                   "· after: $(grep -cE '^[a-zA-Z0-9_.-]+==' "homeschool-api/$f")"
              echo
            done
            echo '**Before merging:** confirm the counts match (a change there means a'
            echo 'package was added or removed, not just bumped) and that every named'
            echo 'package is one this codebase can absorb. CI runs the full suite'
            echo 'against these pins.'
            echo 'PRBODY'
          } >> "$GITHUB_OUTPUT"

      - name: Push the standing refresh branch
        if: steps.regen.outputs.drifted == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add homeschool-api/requirements.lock.txt homeschool-api/requirements-dev.lock.txt
          git commit -m "Refresh the backend lockfiles

          Regenerated from unchanged requirements*.in by
          .github/workflows/lockfile-refresh.yml. See the pull request body for
          which packages moved."
          # Force-push is correct here and only here: this branch holds nothing
          # but the newest regeneration, and yesterday's is not worth keeping.
          git push --force origin "$BRANCH"

      - name: Open or update the standing pull request
        if: steps.regen.outputs.drifted == 'true'
        env:
          # Passed as an environment variable and read as "$BODY" — NEVER
          # interpolated into the script with ${{ }}.
          #
          # Actions substitutes those expressions into the script TEXT before
          # bash ever parses it, so a body containing backticks — and this one
          # does, it is markdown — gets command-substituted by the shell. That
          # is exactly what happened on 2026-08-18: the body's own
          # `.github/workflows/lockfile-refresh.yml` was executed ("Permission
          # denied"), along with `requirements*.in`, `lockfile-freshness` and
          # every `package==version` line in the diff. The body reached the
          # pull request mangled and stray commands ran on the runner.
          #
          # It is also the canonical GitHub Actions script-injection shape,
          # and worth keeping in mind that the package names in this body come
          # from PyPI metadata, not from this repository.
          BODY: ${{ steps.summary.outputs.body }}
        run: |
          # One PR, reused. Daily runs update it in place rather than opening
          # a queue of near-identical pull requests, which is the specific
          # noise #285 removed Dependabot's version updates over.
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$BODY"
            echo "Updated existing PR #$existing"
          elif ! gh pr create \
              --head "$BRANCH" --base main \
              --title "Refresh the backend lockfiles" \
              --body "$BODY"; then
            # The branch is already pushed by the step above, so the refresh
            # itself succeeded and nothing is lost — only the pull request is
            # missing. Say that, and say where the most likely cause lives,
            # because it is NOT in this repository: `pull-requests: write` is
            # necessary but not sufficient, and a separate repository/org
            # toggle governs it. Without this the run ends on a bare GraphQL
            # error and the daily job looks broken rather than blocked.
            echo "::error::Refresh succeeded but the pull request could not be opened."
            echo "Branch '$BRANCH' is pushed and current — it can be opened by hand:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo ""
            echo "If the error above is 'GitHub Actions is not permitted to create or"
            echo "approve pull requests', that is a repository setting this workflow"
            echo "cannot change, and no edit here will fix it. Enable it at:"
            echo "  Settings > Actions > General > Workflow permissions"
            echo "  > 'Allow GitHub Actions to create and approve pull requests'"
            exit 1
          fi
          # Deliberately does not merge. demo-watchdog.yml draws the same line:
          # it opens a pull request and stops.
