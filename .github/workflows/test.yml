name: Backend regression tests

# Fast unit-level regression suite — runs on every push/PR so a broken PIN
# policy, a mis-wired voice fallback, etc. is caught before merge. The
# heavier "does the whole production stack actually boot" check lives in
# production-regression.yml since it needs a real Docker daemon and takes
# much longer.
#
# pip-audit runs as a HARD gate here, mirroring frontend-tests.yml's
# `npm audit --audit-level=high`. See that file's header for the full
# history: this gate was deleted in #296 alongside its npm counterpart,
# on a premise that did not hold up, and is restored together with
# .github/dependabot.yml so it has the auto-fix companion it was missing.
# A red gate means upgrade the pin, or record an unreachability argument
# in .github/audit-allowlist.json — never delete the step.
#
# Dependencies are installed from the hash-locked requirements.lock.txt /
# requirements-dev.lock.txt (pip-compile --generate-hashes), not the
# floor-pinned requirements.in / requirements-dev.in directly — so what
# this job actually tests is byte-for-byte what a fresh install produces,
# not whatever the resolver happens to pick that day. See
# docs/SECURITY.md's closed-gap entry and homeschool-api/requirements.in's
# own header. The lockfile-freshness job below is what keeps the lockfile
# from silently drifting out of sync with the .in files the way other
# config in this repo already has (see CLAUDE.md's "Thirty settings never
# reached the container" incident) — a red lockfile-freshness check means
# re-run homeschool-api/scripts/check_lockfile_freshness.sh --fix and
# commit the result.
on:
  push:
    branches: [main]
    paths:
      - 'homeschool-api/**'
      - 'scripts/setup_wizard/**'
      - 'scripts/trust_service/**'
      - 'scripts/mcp_server/**'
      - 'agent-governance/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

# No job here writes to the repo, comments on a PR, or creates a release —
# the default token only ever needs to check out code.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything that is not a pull_request (push to main,
          # workflow_dispatch) runs the full set — the skip is a PR-only
          # optimisation, and failing open here costs CI minutes rather than
          # coverage.
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paths outside homeschool-api/ are named here because a test in it
          # reads them, and without the name a change to only that file
          # computes relevant=false, skips api-tests, and never runs the guard
          # on the one kind of change it exists for:
          #   docs/DECISIONS.md          tests/test_decision_register.py
          #   docs/RETENTION_POLICY.md   tests/test_coppa_compliance.py
          #   docs/INFORMATION_SECURITY_POLICY.md, docs/DATA_RETENTION.md   ditto
          #   demo/public/privacy.html   ditto (the public disclosure the
          #                              policies must agree with)
          #   scripts/build_pages_site.sh, render.yaml                      ditto
          #   LICENSE, README.md, agent-governance/   tests/test_license_carveout.py
          # agent-governance/ is additionally named because it carries its own
          # guards (agent-governance/reference/test_governance.py), run by the
          # agent-governance-tests job below.
          if git diff --name-only "$BASE_SHA" HEAD \
               | grep -qE '^(homeschool-api/|scripts/setup_wizard/|scripts/trust_service/|scripts/mcp_server/|scripts/build_pages_site\.sh|ipad-profile\.sh|homeschool-tutor/public/|homeschool-tutor/index\.html|site/_headers|wrangler\.jsonc|docs/DECISIONS\.md|docs/PRICING_RESEARCH\.md|docs/LOCALE_RESEARCH\.md|docs/ACCESSIBILITY_RESEARCH\.md|docs/RELEASE_QUALITY_GATES\.md|docker-compose\.yml|Makefile|docs/RETENTION_POLICY\.md|docs/INFORMATION_SECURITY_POLICY\.md|docs/DATA_RETENTION\.md|demo/public/privacy\.html|homeschool-tutor/src/i18n/|demo/src/i18n/|render\.yaml|agent-governance/|LICENSE|README\\.md|\.github/workflows/test\.yml|\.github/workflows/lockfile-refresh\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
  api-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: homeschool-api
        # From the hash-locked lockfile, not requirements-dev.in directly —
        # see this file's header.
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Audit dependencies for known vulnerabilities
        working-directory: homeschool-api
        # Hard gate — see this file's header. Both lockfiles are audited: a
        # dev-only CVE still runs on this runner against this repo's code.
        # Audited against the LOCKFILE (exact pinned versions), not the
        # floor-pinned .in files, since the lockfile is what's actually
        # installed above. IGNORE_ARGS is built from
        # .github/audit-allowlist.json's recorded, justified exceptions —
        # see that file for what's listed and why. Anything not listed
        # there still fails this gate; upgrade the pin, or add a new
        # entry with a real reason.
        run: |
          pip install pip-audit
          IGNORE_ARGS=$(python3 -c "
          import json
          with open('../.github/audit-allowlist.json') as f:
              data = json.load(f)
          ids = [e['id'] for e in data.get('python', [])]
          print(' '.join(f'--ignore-vuln {i}' for i in ids))
          ")
          pip-audit -r requirements.lock.txt $IGNORE_ARGS
          pip-audit -r requirements-dev.lock.txt $IGNORE_ARGS
      - name: Run tests
        working-directory: homeschool-api
        run: python -m pytest tests/ -v

  agent-governance-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # agent-governance/ is a separately licensed, self-contained package
    # (Apache-2.0 — see docs/DECISIONS.md entry 18 and LICENSE section 6).
    # Its guards are what make its prompt rules enforceable rather than
    # decorative, so they run here rather than only on whoever remembers.
    # Deliberately its own job: it needs no backend dependency, so it must
    # not be coupled to homeschool-api's lockfile install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Run the governance package's own guards
        # BEDE_REQUIRE_NODE turns the parity check's "node not installed" skip
        # into a failure. Without it, a runner that lost node would report a
        # pass for a check that never ran — the vacuous green this repo has
        # shipped before.
        env:
          BEDE_REQUIRE_NODE: '1'
        run: |
          pip install pytest
          python -m pytest agent-governance/reference/test_governance.py -v

  lockfile-freshness:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Fails if requirements.lock.txt / requirements-dev.lock.txt disagree with
    # the requirements*.in they are generated from — the guard against the
    # exact shape of silent drift CLAUDE.md's "Thirty settings never reached
    # the container" incident describes: a file that looks maintained but
    # isn't actually checked against its own source of truth.
    #
    # ── WHAT THIS NO LONGER DOES, AND WHY ────────────────────────────────
    #
    # Until 2026-09-02 this ran check_lockfile_freshness.sh, which resolves
    # against PyPI and fails when the committed pins are not what pip-compile
    # produces TODAY. That made every pull request hostage to the world:
    # openai 3.0.0 -> 3.1.0, charset-normalizer 3.5.0 -> 3.5.1,
    # cuda-pathfinder 1.6.0 -> 1.6.1 and protobuf 7.36.0 -> 7.36.1 each turned
    # this red with nothing in the repository having changed. The toil was
    # meant to be absorbed by lockfile-refresh.yml, which is now off (a daily
    # refresh of ~110 packages was destabilising the deployed backend), so
    # nothing absorbed it. See docs/DECISIONS.md entry 12's 2026-09-02
    # amendment for the re-decision.
    #
    # The job name is deliberately unchanged: it may be configured as a
    # required status check, and renaming it would silently stop that
    # requirement applying to anything.
    #
    # Currency is now an ATTENDED concern, not a per-PR gate — a refresh
    # changes what production installs on its next deploy, which is a
    # deployment rather than CI hygiene. Run check_lockfile_freshness.sh, or
    # dispatch lockfile-refresh.yml, when someone is watching.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the checker's only dependency
        # `packaging` alone — deliberately NOT the lockfile. This gate reads
        # two text files and must stay runnable even when the environment it
        # is checking cannot be installed.
        run: pip install --quiet packaging
      - name: Check lockfiles agree with requirements*.in
        working-directory: homeschool-api
        # python scripts/... rather than ./scripts/... — deliberately does not
        # depend on the executable bit surviving whatever wrote this file to
        # the repo (GitHub's Contents API, which some non-git write paths go
        # through, does not preserve it), matching the convention already
        # used for scripts/build_github_pages_redirect.sh elsewhere in this
        # repo's workflows.
        run: python scripts/check_lockfile_consistency.py

  demo-concurrency-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Separate from api-tests above (which stays fast/no-DB, per the comment
    # at the top of this file): boots a real uvicorn subprocess against a
    # real Postgres to exercise proxy-header handling at the ASGI-server
    # layer, which an in-process TestClient can't reach. See
    # tests/test_demo_concurrency.py for what this actually verifies — a
    # regression guard for the missing --proxy-headers trust that once let
    # every demo visitor collapse onto one shared rate-limit bucket.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bede_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: homeschool-api
        run: pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run the demo concurrency scaling test
        working-directory: homeschool-api
        env:
          DEMO_CONCURRENCY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bede_concurrency_test
        run: python -m pytest tests/test_demo_concurrency.py -v

  wizard-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        working-directory: scripts/setup_wizard
        run: python -m pytest test_wizard.py -v

  trust-service-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pytest and segno
        run: pip install pytest segno
      - name: Run tests
        working-directory: scripts/trust_service
        run: python -m pytest test_trust_service.py -v

  mcp-server-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # scripts/mcp_server/ runs on a PARENT's own machine, not in the Bede
    # container, so it has its own requirements file and the API image never
    # grows an MCP dependency. Same shape as the wizard/trust-service jobs
    # above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: scripts/mcp_server
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run tests
        working-directory: scripts/mcp_server
        run: python -m pytest test_bede_tools.py test_server.py -v
