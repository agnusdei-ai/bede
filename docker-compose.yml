# ── Bede Homeschool Tutor — secure deployment ─────────────────────────────────
#
# Required env vars (set in .env or shell — never hardcoded here):
#   SECRET_KEY          JWT signing key   (openssl rand -hex 32)
#   MASTER_SECRET       Encryption master secret (openssl rand -hex 32)
#   PARENT_PASSWORD     Parent login password
#   CHILD_PIN           Child login PIN
#   DATABASE_URL        PostgreSQL connection string — see "Storage model" below
#   LICENSE_KEY         Offline license certificate — see docs/PRODUCTION_SETUP.md#licensing
#
# AI provider — pick at least ONE (setup.sh/setup-gui ask you to choose):
#   ANTHROPIC_API_KEY   Claude API key — console.anthropic.com
#   OPENAI_API_KEY      OpenAI API key — platform.openai.com
#   MISTRAL_API_KEY     Mistral API key — console.mistral.ai
#   LOCAL_LLM_BASE_URL  A self-hosted, open-weight model's /v1 endpoint (no
#                       account, no per-message cost — needs your own GPU
#                       server, see docs/PROVIDER_ADAPTERS.md)
# core/config.py refuses to start in production if none of these are set.
# BEDE_ADAPTER_ORDER picks which configured one Bede actually uses — see
# docs/PROVIDER_ADAPTERS.md for the full picture (multiple can be configured
# at once for automatic failover).
#
# Storage model — two options, see docs/PRODUCTION_SETUP.md:
#   1. Managed Postgres (Neon/Supabase/etc., the original default) — nothing
#      to run yourself, automatic backups, but an external account and your
#      encrypted data leaves this machine for their cloud.
#        DATABASE_URL=postgresql+asyncpg://user:pass@host/db?ssl=require
#   2. Local Postgres (the `db` service below) — zero external accounts,
#      nothing leaves this machine, but backups are your responsibility (see
#      `make db-backup`). Enabled by setting in .env:
#        COMPOSE_PROFILES=local-db
#        POSTGRES_PASSWORD=<openssl rand -hex 24>
#        DATABASE_URL=postgresql+asyncpg://sage:<same password>@db:5432/bede
#   setup.sh asks which you want and wires this up for you either way.
#
#   Either way, the api container itself stays fully stateless — no local
#   volumes, no writable filesystem except /tmp for audio processing.

services:
  api:
    build:
      context: ./homeschool-api
      dockerfile: Dockerfile
    expose:
      - "8000"
    # `required: false` means this is a no-op when the local-db profile isn't
    # active (managed Postgres path) — api starts immediately either way.
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - MASTER_SECRET=${MASTER_SECRET:?MASTER_SECRET is required}
      - PARENT_PASSWORD=${PARENT_PASSWORD:?PARENT_PASSWORD is required}
      - CHILD_PIN=${CHILD_PIN:?CHILD_PIN is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - LICENSE_KEY=${LICENSE_KEY:?LICENSE_KEY is required — issue one with homeschool-api/scripts/issue_license.py, see docs/PRODUCTION_SETUP.md#licensing}
      # Security posture knobs (core/config.py). All optional, all with safe
      # defaults — but they must be listed here or they never reach the
      # container: this block enumerates variables explicitly rather than
      # using env_file, so anything set in .env and NOT named here is
      # silently dropped. A knob documented in .env.example that does
      # nothing is worse than no knob at all.
      #
      # ELEVATION_ENFORCED — require a password step-up for management-plane
      # actions (audit log, AI provider, MFA/recovery changes, permanent
      # student deletion). Defaults true — homeschool-tutor's
      # ElevationPrompt.tsx prompts for the password/TOTP itself and retries
      # the action, so no page needs its own handling. Set false to opt out
      # (e.g. a deployment driving the API directly with no frontend). See
      # docs/SECURITY.md. GET /admin/status reports which posture you have.
      - ELEVATION_ENFORCED=${ELEVATION_ENFORCED:-true}
      - ELEVATION_TTL_MINUTES=${ELEVATION_TTL_MINUTES:-10}
      # LEGACY_TOKEN_GRACE — accept JWTs issued before identity domains
      # existed (core/identity.py). Only needed for the first deploy after
      # upgrading; set false once every pre-upgrade token has expired (8h).
      - LEGACY_TOKEN_GRACE=${LEGACY_TOKEN_GRACE:-true}
      # DEMO_SECRET_KEY — independent signing key for the public demo's
      # identity domain. Irrelevant on a family instance (no demo role in
      # play); listed so the variable behaves the same way everywhere.
      - DEMO_SECRET_KEY=${DEMO_SECRET_KEY:-}
      # AI provider — none of these is individually required; core/config.py
      # instead requires at least ONE of them to be non-empty once
      # PRODUCTION=true (see reject_no_ai_provider_configured_in_production).
      # setup.sh/setup-gui write exactly one of these blocks based on which
      # provider you picked. See docs/PROVIDER_ADAPTERS.md.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-large-latest}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-not-needed}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-Qwen/Qwen3-Coder-30B-A3B-Instruct}
      - BEDE_ADAPTER_ORDER=${BEDE_ADAPTER_ORDER:-local,anthropic}
      - BEDE_FORCE_ADAPTER=${BEDE_FORCE_ADAPTER:-}
      # OpenAI TTS (Bede's spoken voice) — a separate, unrelated use of
      # OPENAI_API_KEY above (services/voice_synthesis.py). Optional either
      # way; leave unset to skip cloud voice entirely — the browser's own
      # built-in speech takes over automatically. See docs/VOICE_SETUP.md.
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-fable}
      - OPENAI_TTS_SPEED=${OPENAI_TTS_SPEED:-0.9}
      # The default below is a verbatim copy of core/config.py's. Two copies
      # of one string would normally be a drift risk; here
      # tests/test_compose_settings_passthrough.py compares them on every
      # run, so the duplication is checked rather than trusted.
      - OPENAI_TTS_INSTRUCTIONS=${OPENAI_TTS_INSTRUCTIONS:-Speak as Bede, an elderly Benedictine monk from Southern England. Warm and gentle, but speak at a slow, deliberate, unhurried pace with clear, distinct diction — leave real space between phrases, never rushed or run together. The quiet, measured cadence of someone used to contemplation and reading aloud, never brisk or robotic. Gentle authority, softly spoken.}
      # Language. Bede converses natively in this language rather than
      # machine-translating; the UI chrome follows via the ui service's own
      # VITE_LOCALE build arg below, which reads this same value. One locale
      # per deployment, offered as a per-login toggle beside English — see
      # docs/LOCALIZATION.md. Setting this also makes SessionConfig.sex
      # required for every student (routers/pod.py), since any student could
      # land in a non-English session once the toggle exists.
      - LOCALE=${LOCALE:-en}
      # Optional — leave RESEND_API_KEY unset to disable the post-session
      # diagnostic email feature entirely. See docs/VOICE_SETUP.md's sibling,
      # services/email_service.py, for what this powers.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_ADDRESS=${RESEND_FROM_ADDRESS:-Bede <bede@agnusdei.ai>}
      # Optional — urgent parent notification when Bede detects a child in
      # distress/danger and pauses the session. Reuses RESEND_API_KEY above.
      # Leave unset to disable this specific alert (the safeguarding event is
      # always recorded in the encrypted audit log regardless).
      - PARENT_EMAIL=${PARENT_EMAIL:-}
      # Optional — where in-app feedback is routed. Unset means POST
      # /feedback returns 404 and the frontend hides the feedback UI
      # entirely (GET /feedback/enabled). Reuses RESEND_API_KEY above.
      - FEEDBACK_EMAIL=${FEEDBACK_EMAIL:-}
      # Optional — unlocks a direct-answer sandbox chat for the parent to
      # test/explore Bede's behavior. Requires already being logged in as
      # parent; leave unset to disable entirely. See routers/sandbox.py.
      - SANDBOX_PIN=${SANDBOX_PIN:-}
      # Parent MFA. Both of these must be set for security keys to work at
      # all: mfa_service.webauthn_enabled() is `rp_id and origin`, and with
      # it false, enrollment and authentication both refuse and
      # GET /mfa/status reports webauthn_available: false. There is no
      # fallback derivation from the request. Since neither reached the
      # container before this list included them, FIDO2 keys were
      # unreachable in the packaged deployment however carefully a parent
      # filled them into .env. They must match the host the parent actually
      # opens Bede on (e.g. RP_ID=bede.lan, ORIGIN=https://bede.lan), since
      # a browser binds a credential to the origin that created it. TOTP is
      # a separate path and was unaffected.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Bede}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      # Shown as the account name in an authenticator app (Google
      # Authenticator, 1Password). Cosmetic, but it is what a parent sees
      # when they look for Bede's code among a dozen others.
      - TOTP_ISSUER=${TOTP_ISSUER:-Bede Homeschool}
      - MFA_PENDING_TOKEN_EXPIRE_MINUTES=${MFA_PENDING_TOKEN_EXPIRE_MINUTES:-5}
      # Session lifetimes, in minutes. A parent session outlives a child's
      # on purpose: a parent is administering, a child is in one sitting.
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - CHILD_TOKEN_EXPIRE_MINUTES=${CHILD_TOKEN_EXPIRE_MINUTES:-240}
      # Voice. WHISPER_MODEL_SIZE and VOICE_TRANSCRIPTION_MAX_CONCURRENCY are
      # the two knobs docs/VOICE_SETUP.md tells a family to reach for when
      # "Transcribing…" takes too long, so they have to actually work.
      # VOICE_THRESHOLD_* govern speaker verification: above HIGH passes,
      # between MEDIUM and HIGH asks a parent, below MEDIUM fails.
      # TRANSCRIPTION_PROVIDER picks WHERE speech-to-text runs: "local"
      # (faster-whisper in-process, the default, and the only correct
      # answer for a family whose whole point is that a child's voice
      # never leaves the LAN) or "openai". The WHISPER_* knobs below
      # only do anything on "local".
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_VAD_FILTER=${WHISPER_VAD_FILTER:-false}
      - VOICE_PARTIAL_MAX_SECONDS=${VOICE_PARTIAL_MAX_SECONDS:-25.0}
      - VOICE_TRANSCRIPTION_MAX_CONCURRENCY=${VOICE_TRANSCRIPTION_MAX_CONCURRENCY:-1}
      - VOICE_THRESHOLD_HIGH=${VOICE_THRESHOLD_HIGH:-0.82}
      - VOICE_THRESHOLD_MEDIUM=${VOICE_THRESHOLD_MEDIUM:-0.68}
      # Per-IP rate limits (core/middleware.py). The voice-stream and
      # account-recovery buckets are separate from their neighbours on
      # purpose — see the comments on each in core/config.py.
      - RATE_LIMIT_AUTH_PER_MINUTE=${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      - RATE_LIMIT_API_PER_MINUTE=${RATE_LIMIT_API_PER_MINUTE:-120}
      - RATE_LIMIT_VOICE_PER_MINUTE=${RATE_LIMIT_VOICE_PER_MINUTE:-20}
      - RATE_LIMIT_VOICE_STREAM_SESSION_PER_MINUTE=${RATE_LIMIT_VOICE_STREAM_SESSION_PER_MINUTE:-120}
      - RATE_LIMIT_ACCOUNT_RECOVERY_PER_MINUTE=${RATE_LIMIT_ACCOUNT_RECOVERY_PER_MINUTE:-10}
      # What Bede is allowed to keep about a child. RETAIN_MASTERY_PROFILES
      # false runs the identical diagnostic but holds the estimate in memory
      # for the session only, writing nothing describing the child; the
      # setup wizard asks a parent this directly. It reaching the container
      # is the whole point of the setting, and for one day it did not.
      - RETAIN_MASTERY_PROFILES=${RETAIN_MASTERY_PROFILES:-true}
      - DIAGNOSTIC_EVIDENCE_LOG_ENABLED=${DIAGNOSTIC_EVIDENCE_LOG_ENABLED:-true}
      # Public-demo only. Irrelevant to a family instance (no demo role is
      # ever reachable without DEMO_PIN); listed so every documented variable
      # behaves the same way everywhere rather than some being silently
      # dropped. See render.yaml for the demo's own deployment.
      - DEMO_PIN=${DEMO_PIN:-}
      - DEMO_STUDENT_NAME=${DEMO_STUDENT_NAME:-Guest}
      - DEMO_GRADE=${DEMO_GRADE:-4}
      - DEMO_GRADE_STAGE=${DEMO_GRADE_STAGE:-3-5}
      - DEMO_CODE_TOKEN_EXPIRE_MINUTES=${DEMO_CODE_TOKEN_EXPIRE_MINUTES:-120}
      - INTERACTION_SIGNAL_LOGGING_ENABLED=${INTERACTION_SIGNAL_LOGGING_ENABLED:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost,http://ui:80}
      - DISABLE_API_DOCS=true
      - PRODUCTION=true
    read_only: true                    # stateless container — all state in Postgres
    tmpfs:
      - /tmp:size=64m,mode=1777       # audio processing temp files only
    # Docker Desktop (Windows/Mac) resolves host.docker.internal to the host
    # machine automatically — needed when LOCAL_LLM_BASE_URL points at a
    # locally-installed Ollama (the packaging/windows and packaging/unix
    # installers' "run AI on this computer" option writes exactly that URL).
    # Docker ENGINE (native Linux, no Docker Desktop) does NOT provide this
    # mapping by default; host-gateway is the documented way to add it
    # yourself since Docker 20.10. Harmless no-op where Docker Desktop
    # already provides the mapping — this just makes it explicit everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional local Postgres — only starts when COMPOSE_PROFILES=local-db is
  # set in .env (setup.sh does this automatically if you choose local
  # Postgres during setup; see the "Storage model" note at the top of this
  # file). Zero external accounts, nothing leaves this machine — the
  # tradeoff is backups become your responsibility instead of a managed
  # provider's; see `make db-backup` / `make db-restore`.
  #
  # Not fully locked down like api/ui above (no cap_drop: ALL) — the
  # official Postgres image's own entrypoint needs broader capabilities to
  # initialize/manage its data directory (chown, etc.) on first run.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      - POSTGRES_USER=sage
      # NOT `:?required` — Compose interpolates every declared service's
      # variables regardless of whether its profile is active, so a hard
      # requirement here would break `make start` for anyone NOT using
      # local-db. Postgres itself refuses to start with an empty password,
      # which is fine: this container is never actually started unless
      # COMPOSE_PROFILES=local-db, and setup.sh always sets a real value
      # together with that profile.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=bede
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage -d bede"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./homeschool-tutor
      dockerfile: Dockerfile
      # The UI half of LOCALE above. Vite inlines VITE_* at BUILD time, not
      # run time, so this has to be a build arg — an environment entry on
      # this service would reach nginx and nothing else. Both language
      # bundles always ship and Login.tsx switches between them live, so
      # this is not what makes the other language available; it decides
      # which one the login screen paints FIRST, before the toggle is
      # touched. A deployment that opted into Spanish should open in it.
      args:
        VITE_LOCALE: ${LOCALE:-en}
    expose:
      - "80"
    depends_on:
      - api
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      # nginx's entrypoint chowns its tmpfs cache dirs (client_temp, etc.)
      # to the nginx user at startup — without this, cap_drop: ALL makes
      # even root unable to chown, and nginx crash-loops on every start.
      # Caught by production-regression.yml's first real end-to-end boot;
      # this combination (read_only + cap_drop: ALL + tmpfs) had never
      # actually been started before that run.
      - CHOWN
      # After chowning its cache dirs, nginx's master (root) forks worker
      # processes and drops them to the nginx user via setuid/setgid —
      # without these, every worker crashes immediately ("setgid(101)
      # failed: Operation not permitted") and nginx ends up with zero
      # working workers, serving nothing, once it runs out of respawn
      # attempts. Caught by the same first real boot as the CHOWN fix
      # above, one capability at a time.
      - SETUID
      - SETGID

  # Always-on "add a tablet" page (no CLI needed) — open http://<server-ip>/trust
  # on a new device, or scan the QR code shown there, to install this server's
  # certificate. Kept separate from `api` because it needs read access to
  # Caddy's CA cert file in `caddy_data` and has an entirely different (much
  # lower) threat/privilege profile — no reason to share api's stricter lockdown.
  trust:
    build:
      context: ./scripts/trust_service
      dockerfile: Dockerfile
    expose:
      - "8080"
    volumes:
      - caddy_data:/data:ro
    networks:
      - internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # TLS termination — serves the entire pod over HTTPS (port 443)
  # Tablets and other LAN devices connect here. Run "make caddy-trust" once
  # per device to install the local root CA so there are no cert warnings.
  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - internal
    depends_on:
      - ui
      - trust
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:     # persists Caddy's local CA and issued certs across restarts
  pgdata:         # local Postgres data — only used when COMPOSE_PROFILES=local-db

networks:
  internal:
    driver: bridge
    internal: false    # api needs outbound for Claude API + managed DB
