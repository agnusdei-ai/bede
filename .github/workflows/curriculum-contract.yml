name: Curriculum production contract

on:
  pull_request:
    paths:
      - 'curriculum/production-spec/**'
      - 'curriculum/factory/**'
      - 'homeschool-api/services/curriculum/**'
      - 'homeschool-api/services/diagnostic/**'
      - 'homeschool-api/services/content_curation.py'
      - 'homeschool-api/services/educator_access.py'
      - 'homeschool-api/models/schemas.py'
      - 'homeschool-api/core/encryption.py'
      - 'homeschool-api/tests/test_curriculum*.py'
      - 'homeschool-api/tests/test_content_curation.py'
      - 'homeschool-api/requirements*.lock.txt'
      - '.github/workflows/curriculum-contract.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/production-spec/**'
      - 'curriculum/factory/**'
      - 'homeschool-api/services/curriculum/**'
      - 'homeschool-api/services/diagnostic/**'
      - 'homeschool-api/services/content_curation.py'
      - 'homeschool-api/services/educator_access.py'
      - 'homeschool-api/models/schemas.py'
      - 'homeschool-api/core/encryption.py'
      - 'homeschool-api/tests/test_curriculum*.py'
      - 'homeschool-api/tests/test_content_curation.py'
      - 'homeschool-api/requirements*.lock.txt'
      - '.github/workflows/curriculum-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Specification tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Validate bounded synthetic contract
        working-directory: curriculum/production-spec
        run: |
          timeout 35s python -B verify.py
          timeout 35s python -B contract.py check
      - name: Verify schema and deterministic export entry points
        working-directory: curriculum/production-spec
        run: |
          python -B - <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          for action in ("schema", "export"):
              first = subprocess.check_output(
                  [sys.executable, "-B", "contract.py", action], timeout=35)
              second = subprocess.check_output(
                  [sys.executable, "-B", "contract.py", action], timeout=35)
              assert first == second, f"Nondeterministic {action}"
              json.loads(first)
              print(action, hashlib.sha256(first).hexdigest())
          PY
  factory:
    name: Offline factory and existing curriculum regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Synthetic configuration only; no GitHub environment or secret access.
      SECRET_KEY: synthetic-test-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      MASTER_SECRET: synthetic-test-master-yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
      ANTHROPIC_API_KEY: synthetic-no-network
      DATABASE_URL: postgresql+asyncpg://synthetic:synthetic@127.0.0.1/never_connect
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install existing hash-locked test dependencies
        working-directory: homeschool-api
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt
      - name: Run bounded offline acceptance
        run: timeout 35s python -B curriculum/factory/verify.py
      - name: Run existing affected curriculum and curation tests
        working-directory: homeschool-api
        run: |
          timeout 60s python -B -m pytest --noconftest \
            -o asyncio_default_fixture_loop_scope=function \
            tests/test_curriculum*.py tests/test_content_curation.py -q
