name: Bede Standard and Offline operator bundles
on:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/build-bede-operator.yml'
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'bede-operator-v*'
    paths:
      - '.github/workflows/build-bede-operator.yml'
      - 'packaging/**'
      - '.github/workflows/qualification.yml'
      - 'homeschool-api/services/canonical_assessment.py'
      - 'homeschool-api/routers/pilot_assessments.py'
      - 'homeschool-tutor/src/components/PilotOfficialAssessmentForm.tsx'
      - 'homeschool-tutor/src/components/PilotTeacherJourney.tsx'
      - 'homeschool-tutor/src/services/api.ts'
permissions:
  contents: read
  packages: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target_os: linux
            runner: ubuntu-24.04
          - arch: arm64
            target_os: linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare bundle generator
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Install archive compressor
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Verify LAN opt-in and WebAuthn wizard contracts
        run: |
          python -m py_compile scripts/setup_wizard/wizard.py
          python packaging/tests/test_lan_wizard.py
          python packaging/tests/test_mac_windows_release_parity.py
      - name: Build versioned application and setup images
        run: |
          set -euo pipefail
          prefix="ghcr.io/agnusdei-ai/bede"
          sha="${GITHUB_SHA}"
          arch="${{ matrix.arch }}"
          detected="$(docker info --format '{{.Architecture}}')"
          case "$detected" in x86_64|amd64) detected=amd64 ;; aarch64|arm64) detected=arm64 ;; esac
          test "$detected" = "$arch" || { echo "Native runner architecture mismatch: $detected vs $arch"; exit 1; }
          docker build -t "${prefix}-api:sha-${sha}-${arch}" -f homeschool-api/Dockerfile homeschool-api
          docker build -t "${prefix}-ui:sha-${sha}-${arch}" -f homeschool-tutor/Dockerfile homeschool-tutor
          docker build -t "${prefix}-trust:sha-${sha}-${arch}" -f scripts/trust_service/Dockerfile scripts/trust_service
          docker build -t "${prefix}-wizard:sha-${sha}-${arch}" -f scripts/setup_wizard/Dockerfile .
      - name: Publish application images and capture registry digests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          : > image-digests.txt
          for component in api ui trust wizard; do
            image="ghcr.io/agnusdei-ai/bede-${component}:sha-${GITHUB_SHA}-${{ matrix.arch }}"
            docker push "$image"
            digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            printf '%s %s\n' "$image" "$digest" >> image-digests.txt
          done
          for image in postgres:16-alpine caddy:2-alpine; do
            docker pull "$image"
            digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' | sed 's/^.*@//')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            printf '%s %s\n' "$image" "$digest" >> image-digests.txt
          done
      - name: Generate source-free installer and seal embedded images
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python packaging/build_operator_bundle.py
          cp image-digests.txt dist/bede-operator/IMAGE_DIGESTS
          # Record traceable immutable package identity without claiming G3 or Pilot GO.
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "source_sha": os.environ["GITHUB_SHA"],
              "architecture": "${{ matrix.arch }}",
              "build_run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "contents": "source-free operator images and launchers",
              "scope": "teacher-directed, synthetic-only Valor pilot evaluation",
              "learner_delivery": "NOT_REQUESTED",
              "physical_mac": "NOT_RUN",
              "engineering_acceptance": "NOT_SIGNED",
              "pilot_go": "HOLD",
              "prior_146_cell_candidate": "6574a0e1b69ed3b162c39c626be316c4e457db4e",
              "prior_qualification_carries_to_this_sha": False
          }
          Path("dist/bede-operator/RELEASE_PROVENANCE.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY
          docker save -o dist/bede-operator/images.tar \
            ghcr.io/agnusdei-ai/bede-api:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-ui:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-trust:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-wizard:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            postgres:16-alpine caddy:2-alpine
          docker image inspect \
            ghcr.io/agnusdei-ai/bede-api:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-ui:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-trust:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            ghcr.io/agnusdei-ai/bede-wizard:sha-${GITHUB_SHA}-${{ matrix.arch }} \
            postgres:16-alpine caddy:2-alpine \
            --format '{{.RepoTags}} {{.Size}}' > dist/bede-operator/IMAGE_SIZES.txt
          chmod +x dist/bede-operator/start.sh dist/bede-operator/Install-Bede.command dist/bede-operator/Verify-Bede.command dist/bede-operator/simulation/Run-Bede-Installer-Test.command
          bash -n dist/bede-operator/Verify-Bede.command
          python packaging/tests/test_operator_arch.py
          python packaging/tests/test_lite_offline.py
          python -m py_compile packaging/tests/test_valor_prepilot_browser.py
          bash -n dist/bede-operator/simulation/Run-Bede-Installer-Test.command
          bash -n dist/bede-operator/start.sh dist/bede-operator/Install-Bede.command
          python - <<'PY'
          from pathlib import Path
          import yaml
          d = Path('dist/bede-operator')
          config = yaml.safe_load((d/'compose.yaml').read_text())
          for name in ('api','ui','trust','locuto-ipc'):
              assert 'image' in config['services'][name]
              assert 'build' not in config['services'][name]
          assert '127.0.0.1:443:443' in config['services']['caddy']['ports']
          lan = yaml.safe_load((d/'compose.lan.yaml').read_text())
          lan_ports = lan['services']['caddy']['ports']
          assert all('BEDE_LAN_BIND_IP' in str(port) for port in lan_ports)
          assert all('0.0.0.0' not in str(port) for port in lan_ports)
          assert any(':443:443' in str(port) for port in lan_ports)
          assert (d/'ARCH').read_text().strip() == '${{ matrix.arch }}'
          import json, os
          provenance = json.loads((d/'RELEASE_PROVENANCE.json').read_text())
          assert provenance['source_sha'] == os.environ['GITHUB_SHA']
          assert provenance['architecture'] == '${{ matrix.arch }}'
          assert provenance['learner_delivery'] == 'NOT_REQUESTED'
          assert provenance['physical_mac'] == 'NOT_RUN'
          assert provenance['pilot_go'] == 'HOLD'
          for name in ('images.tar','Open-Bede-Prepilot.html','Install-Bede.command','Install-Bede.ps1','Verify-Bede.command','compose.lan.yaml','TWO_MAC_TEACHER_PILOT.md','.env.example','Caddyfile','WIZARD_IMAGE'):
              assert (d/name).exists(), name
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path('dist/bede-operator/images.tar')
          (p.parent/'PAYLOAD_METRICS.txt').write_text(f'Uncompressed image archive bytes: {p.stat().st_size}\\n')
          PY
          zstd -T0 -19 -f dist/bede-operator/images.tar -o dist/bede-operator/images.tar.zst
          rm dist/bede-operator/images.tar
          cp -a dist/bede-operator dist/bede-operator-standard
          rm -f dist/bede-operator-standard/images.tar dist/bede-operator-standard/images.tar.zst
          cd dist
          tar -czf bede-operator-standard-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz bede-operator-standard
          sha256sum bede-operator-standard-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz > bede-operator-standard-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz.sha256
          tar -czf bede-operator-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz bede-operator
          sha256sum bede-operator-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz > bede-operator-${GITHUB_SHA}-${{ matrix.arch }}.tar.gz.sha256
      - name: Publish standard network installer separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bede-standard-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/bede-operator-standard-${{ github.sha }}-${{ matrix.arch }}.tar.gz
            dist/bede-operator-standard-${{ github.sha }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish complete Offline installer separately
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bede-offline-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/bede-operator-${{ github.sha }}-${{ matrix.arch }}.tar.gz
            dist/bede-operator-${{ github.sha }}-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  prepilot-browser:
    name: Valor offline administrator experience
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned browser harness
        run: python -m pip install playwright==1.56.0
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Exercise offline walkthrough and local audit export
        run: python packaging/tests/test_valor_prepilot_browser.py
      - name: Publish standalone walkthrough for nontechnical reviewers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bede-valor-prepilot-walkthrough-${{ github.sha }}
          path: packaging/bundle/Valor-Prepilot-Walkthrough.html
          if-no-files-found: error
          retention-days: 30

  validate-launchers:
    name: Native launcher syntax
    needs: [package, prepilot-browser]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: macOS and Linux launcher syntax
        if: runner.os != 'Windows'
        run: |
          bash -n packaging/bundle/start.sh
          bash -n packaging/bundle/Install-Bede.command
          bash -n packaging/bundle/Verify-Bede.command
      - name: Windows PowerShell launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'packaging/bundle/Install-Bede.ps1').Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }


  package-mac-pilot:
    name: Bede Mac pilot app
    needs: package
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download compact ARM64 operator runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          name: bede-standard-linux-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/bede-artifact
      - name: Verify compact runtime and immutable image references
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bede-artifact"
          shasum -a 256 -c "bede-operator-standard-$GITHUB_SHA-arm64.tar.gz.sha256"
          tar -xzf "bede-operator-standard-$GITHUB_SHA-arm64.tar.gz"
          test "$(cat bede-operator-standard/ARCH)" = arm64
          test "$(cat bede-operator-standard/RELEASE)" = "$GITHUB_SHA"
          test -s bede-operator-standard/IMAGE_DIGESTS
          test ! -e bede-operator-standard/images.tar
          test ! -e bede-operator-standard/images.tar.zst
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths = Path("bede-operator-standard")
          entries = (paths / "IMAGE_DIGESTS").read_text().splitlines()
          assert len(entries) == 6, "Expected four Bede images, PostgreSQL and Caddy"
          for entry in entries:
              assert re.fullmatch(r"\S+ sha256:[0-9a-f]{64}", entry), "Invalid immutable image digest"
          print("Six immutable container references verified. No images embedded.")
          PY
      - name: Compile branded Mac installer and package native app
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/macos/build-app.sh "$RUNNER_TEMP/bede-artifact/bede-operator-standard" "$RUNNER_TEMP/native"
          test -s "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/BedeIcon.png"
          test -s "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/bede-operator/IMAGE_DIGESTS"
          test ! -e "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/bede-operator/images.tar"
          test ! -e "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/bede-operator/images.tar.zst"
          test -x "$RUNNER_TEMP/native/Bede Installer.app/Contents/MacOS/BedeInstaller"
          test -s "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/BedeInstaller.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$RUNNER_TEMP/native/Bede Installer.app/Contents/Info.plist")" = BedeInstaller.icns
          # Engineering candidate: deliberately ad hoc signed, NOT notarized or trusted for distribution.
          # Trusted distribution is a distinct explicitly requested release workflow.
          codesign --force --deep --sign - "$RUNNER_TEMP/native/Bede Installer.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/native/Bede Installer.app"
          test -x "$RUNNER_TEMP/native/Bede Installer.app/Contents/Resources/BedeUninstall.sh"
          hdiutil create -volname "Bede Engineering Candidate" -srcfolder "$RUNNER_TEMP/native/Bede Installer.app" -ov -format UDZO "$RUNNER_TEMP/Bede-Engineering-Mac-arm64.dmg"
          echo "ENGINEERING TEST ONLY: ad hoc signed, unnotarized, not approved for external distribution." > "$RUNNER_TEMP/NOT_FOR_DISTRIBUTION.txt"
          # Catch accidental reintroduction of the enormous offline Docker archive.
          dmg_bytes="$(stat -f %z "$RUNNER_TEMP/Bede-Engineering-Mac-arm64.dmg")"
          echo "Compact Mac DMG size: $dmg_bytes bytes"
          test "$dmg_bytes" -lt $((50 * 1024 * 1024)) || {
            echo "Compact Mac installer exceeds 50 MiB. Check bundled images." >&2
            exit 1
          }
          ( cd "$RUNNER_TEMP" && shasum -a 256 "Bede-Engineering-Mac-arm64.dmg" > "Bede-Engineering-Mac-arm64.dmg.sha256" )
      - name: Upload ad hoc signed engineering candidate only (not for distribution)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bede-mac-engineering-unnotarized-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Bede-Engineering-Mac-arm64.dmg
            ${{ runner.temp }}/Bede-Engineering-Mac-arm64.dmg.sha256
            ${{ runner.temp }}/NOT_FOR_DISTRIBUTION.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30


  # Windows and Mac native candidates use the SAME source-SHA operator workflow.
  # This is not production deployment or signing authorization.
  package-windows-standard:
    name: Bede Windows x64 Standard engineering installer
    needs: package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download source-free pinned amd64 operator payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7
        with:
          name: bede-standard-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/bede-windows-source
      - name: Stage and verify exact-release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'bede-windows-source'
          $hashFile = Join-Path $source "bede-operator-standard-$env:GITHUB_SHA-amd64.tar.gz.sha256"
          $bundle = Join-Path $source "bede-operator-standard-$env:GITHUB_SHA-amd64.tar.gz"
          if (!(Test-Path $hashFile) -or !(Test-Path $bundle)) { throw 'Missing immutable payload or hash' }
          $expected = ((Get-Content $hashFile -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'Operator artifact checksum mismatch' }
          tar -xzf $bundle -C $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract verified operator payload' }
          $operator = Join-Path $source 'bede-operator-standard'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/release-payload'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -LiteralPath $operator -Force | Copy-Item -Destination $dest -Recurse -Force
          if ((Get-Content "$dest/RELEASE" -Raw).Trim() -cne $env:GITHUB_SHA) { throw 'Source SHA mismatch' }
          if ((Get-Content "$dest/ARCH" -Raw).Trim() -cne 'amd64') { throw 'Wrong runtime architecture' }
          $data = Get-Content "$dest/RELEASE_PROVENANCE.json" -Raw | ConvertFrom-Json
          if ($data.source_sha -cne $env:GITHUB_SHA -or $data.architecture -cne 'amd64' -or $data.pilot_go -cne 'HOLD') { throw 'Invalid provenance' }
          if (!(Test-Path "$dest/Install-Bede.ps1") -or !(Test-Path "$dest/IMAGE_DIGESTS")) { throw 'Missing verified Windows launcher or immutable image manifest' }
          if (Test-Path "$dest/images.tar") { throw 'Standard installer must not embed raw Docker images' }
          if (Test-Path "$dest/images.tar.zst") { throw 'Standard installer must not embed compressed Docker images' }
          $script = Get-Content "$dest/Install-Bede.ps1" -Raw
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("PowerShell launcher syntax: " + $parseErrors[0].Message) }
          if ($script -match 'git\s+(clone|pull)') { throw 'Source checkout is not permitted in release launcher' }
          if ($script -notmatch 'IMAGE_DIGESTS' -or $script -notmatch 'docker\.exe' -or $script -notmatch '\-\-cacert') { throw 'Missing pinning or secure health contracts' }
      - name: Build the native Windows release-candidate EXE
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275 # v1.2.2
        with:
          path: packaging/windows/BedeRelease.iss
      - name: Smoke-test native Windows EXE extraction without launching Bede
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/Output/BedeRelease.exe'
          $installed = Join-Path $env:RUNNER_TEMP 'bede-native-installer-smoke'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR=' + $installed))
          $process = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Windows installer failed: $($process.ExitCode)" }
          foreach ($name in @('Install-Bede.ps1','compose.yaml','Caddyfile',
              'RELEASE','ARCH','IMAGE_DIGESTS','WIZARD_IMAGE','RELEASE_PROVENANCE.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $installed $name))) { throw ("Windows EXE is missing: " + $name) }
          }
          if ((Get-Content (Join-Path $installed 'RELEASE') -Raw).Trim() -cne $env:GITHUB_SHA) {
            throw 'Native installer source SHA differs from its build'
          }
          if ((Get-Content (Join-Path $installed 'ARCH') -Raw).Trim() -cne 'amd64') {
            throw 'Windows native installer contains wrong architecture'
          }
          $tokens = $null
          $parseErrors = $null
          $code = Get-Content (Join-Path $installed 'Install-Bede.ps1') -Raw
          [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Extracted Windows launcher cannot parse: " + $parseErrors[0].Message) }
          if (Test-Path (Join-Path $installed '.env')) { throw 'Native installer must not silently initialize user data' }
          Write-Host 'Windows EXE installed sealed source-free payload. No Docker or learner data was started.'

      - name: Validate candidate, record source SHA and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/Output/BedeRelease.exe'
          if (!(Test-Path $output) -or (Get-Item $output).Length -lt 100000) { throw 'No native Inno EXE was produced' }
          if ((Get-AuthenticodeSignature $output).Status -ne 'NotSigned') { throw 'Engineering candidate must not be labeled distribution-signed' }
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'dist/windows-engineering'
          New-Item -ItemType Directory -Force -Path $candidate | Out-Null
          $filename = 'Bede-Engineering-Windows-amd64.exe'
          Copy-Item $output (Join-Path $candidate $filename)
          $hash = (Get-FileHash (Join-Path $candidate $filename) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $filename" | Set-Content -Encoding ASCII (Join-Path $candidate "$filename.sha256")
          "ENGINEERING CANDIDATE ONLY. Source SHA: $env:GITHUB_SHA. Unsigned; not approved for external distribution, real learner data or Pilot GO." | Set-Content -Encoding ASCII (Join-Path $candidate 'NOT_FOR_DISTRIBUTION.txt')
          Copy-Item 'packaging/windows/release-payload/RELEASE_PROVENANCE.json' (Join-Path $candidate 'RELEASE_PROVENANCE.json')
          Copy-Item 'packaging/windows/release-payload/IMAGE_DIGESTS' (Join-Path $candidate 'IMAGE_DIGESTS')
          Write-Host "Built source-free Windows candidate for $env:GITHUB_SHA with SHA256 $hash"
      - name: Upload Windows engineering candidate (not a trusted release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bede-windows-engineering-unsigned-amd64-${{ github.sha }}
          path: dist/windows-engineering/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
