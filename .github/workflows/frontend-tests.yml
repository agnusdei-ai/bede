name: Frontend regression tests

# Closes a real gap: test.yml ("Backend regression tests") never covered
# either frontend app — its path filters only match homeschool-api/** and
# the two script dirs, so a demo/** or homeschool-tutor/**-only PR got zero
# CI checks at all (confirmed directly: PR #182 and #185 both showed
# mergeable_state clean with total_count: 0 check-runs, merged on local
# `npx tsc --noEmit` + `npx vitest run` output instead of any automated
# gate). This workflow is that gate, mirroring test.yml's own
# push(main)/pull_request/workflow_dispatch trigger shape and per-job
# path-filtered structure, just for the two Vite/React apps instead of
# the Python backend.
#
# `npm audit --audit-level=moderate` runs as a HARD gate in each job.
#
# History worth keeping, because the gate has been removed once already:
# it was deleted in #296 on the reasoning that a CVE "with no fix
# available yet" blocked every unrelated PR, and that .github/dependabot.yml
# (deleted in #285) was no longer there to auto-fix anything. The first
# half of that turned out to be wrong on the facts — every one of the five
# advisories then outstanding had a fix available, and `npm audit fix`
# plus a react-router major bump cleared all five. The second half was
# right, and is addressed properly now: dependabot.yml is restored, so the
# gate has the auto-fix companion whose absence was the real complaint.
#
# The rule going forward: a red audit gate means "upgrade the dependency
# or record why it is unreachable in .github/audit-allowlist.json", never
# "delete the step." Deleting it took this repo from one blocked PR to
# zero vulnerability visibility across three ecosystems, which is a much
# worse trade than the one it was trying to make.
on:
  push:
    branches: [main]
    paths:
      - 'homeschool-tutor/**'
      - 'demo/**'
      - 'site/assets/site.css'
      - 'site/index.html'
      - 'site/privacy/index.html'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
  workflow_dispatch:

# No job here writes to the repo, comments on a PR, or creates a release —
# the default token only ever needs to check out code.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Anything that is not a pull_request (push to main,
          # workflow_dispatch) runs the full set — the skip is a PR-only
          # optimisation, and failing open here costs CI minutes rather than
          # coverage.
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # site/privacy/index.html is in here because demo/src/privacyInventory.test.ts
          # reads it: that page promises a storage inventory with "no rounding up", so a
          # row deleted there makes a public claim false and nothing else would notice.
          # site/assets/site.css is in here because src/palette.test.ts reads
          # it: the app's ramps are pinned to the marketing site's own colour
          # tokens, so retuning the brand palette there is the change most
          # likely to break that agreement. It and site/index.html are BOTH
          # read by src/curriculumColors.test.ts, which pins the curriculum
          # grid against the app's own SUBJECTS list: the accents are bound by
          # nth-child, so adding or reordering a card there shifts every later
          # subject's colour with nothing erroring. Without these paths the skip would
          # compute relevant=false for exactly that edit and never run the
          # guard written for it — the same vacuous-coverage trap
          # test_decision_register.py documents for the backend filter.
          if git diff --name-only "$BASE_SHA" HEAD \
               | grep -qE '^(homeschool-tutor/|demo/|site/assets/site\.css|site/index\.html|site/privacy/index\.html|\.github/workflows/frontend-tests\.yml)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
  # Its own job, for the reason homeschool-api/tests/test_dependency_audit_job.py
  # records about the backend: as a STEP inside a test job, a failing audit left
  # `Type-check` and `Run tests` SKIPPED — so an advisory published by a stranger
  # took the whole frontend suite down with it. That is not hypothetical here
  # either: GHSA-vfj7-8cjw-p6xm (braces) did exactly this on 2026-10-04, hiding
  # 574 homeschool-tutor tests and the demo's behind a dependency finding that
  # had nothing to do with the change under review.
  #
  # The split does NOT weaken the gate. This job still fails the workflow, and
  # the standing rule is unchanged: a red audit means upgrade the dependency, or
  # record why it is unreachable in .github/audit-allowlist.json — never delete
  # the step (see this file's own header on #296). What changes is only that a
  # dependency advisory can no longer hide a test regression behind it.
  frontend-dependency-audit:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
      - name: Install homeschool-tutor dependencies
        working-directory: homeschool-tutor
        run: npm ci
      - name: Install demo dependencies
        working-directory: demo
        run: npm ci
      # Hard gate at MODERATE, not high. `--audit-level=high` was the original
      # threshold and is not sufficient: the open redirect fixed in #319 — the
      # highest-impact finding in that whole review, a post-authentication
      # redirect off-site on the login screen — was published as a MODERATE
      # advisory (GHSA-wrjc-x8rr-h8h6), and a gate set to `high` would have let
      # it through. npm's severity rating reflects the advisory in the abstract,
      # not what the dependency is load-bearing for in THIS app, so the gate
      # errs toward surfacing and letting a human decide.
      #
      # Run through scripts/npm_audit_gate.py rather than `npm audit` directly,
      # because `npm audit` has no --ignore flag and so could not honour the
      # escape hatch this file's own header has always named. See that script's
      # docstring; it fails closed and allowlists by ADVISORY, never by package.
      - name: Audit dependencies for known vulnerabilities
        run: python3 scripts/npm_audit_gate.py homeschool-tutor demo

  homeschool-tutor-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: homeschool-tutor/package-lock.json
      - name: Install dependencies
        working-directory: homeschool-tutor
        run: npm ci
      - name: Type-check
        working-directory: homeschool-tutor
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: homeschool-tutor
        run: npm test

  demo-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install dependencies
        working-directory: demo
        run: npm ci
      - name: Type-check
        working-directory: demo
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: demo
        run: npm test
