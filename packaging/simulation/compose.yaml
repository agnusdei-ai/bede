services:
  bede-installer-simulation:
    build:
      context: .
      dockerfile: Dockerfile
    image: bede-installer-simulation:local
    ports:
      - "127.0.0.1:18766:8766"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: "no"
