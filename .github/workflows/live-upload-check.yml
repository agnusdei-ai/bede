name: Live upload check (sample)

# Checks the DEPLOYED demo, not this repository: that an uploaded picture is
# checked before Bede reads it (services/content_screen.py). A merge and a
# green deploy are not evidence that live behaviour works; this is.
#
# Manual only. Each run spends a few model calls on the public demo, so it
# never runs on a schedule. It sends four sample, harmless pictures drawn
# by the script itself (a marked worksheet, a game screen, a tree drawing)
# and must never be changed to send harmful imagery: the self-harm and
# sexual-content paths are tested with mocked safety responses in
# homeschool-api/tests/test_content_screen.py.
#
# Record each run's result, with the deployed commit from the repository's
# deployment record, in docs/release/UPLOAD_CHECK_VERIFICATION.md.

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Deployed API origin to check'
        required: true
        default: 'https://bede-demo-api.onrender.com'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Pillow
        run: python3 -m pip install --user 'pillow>=10.1'
      - name: Probe the deployment
        env:
          API: ${{ inputs.api }}
        run: |
          set +e
          python3 homeschool-api/scripts/live_upload_check_probe.py --api "$API" > report.json
          code=$?
          cat report.json
          {
            echo "### Live upload check"
            echo ""
            echo '```json'
            cat report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
